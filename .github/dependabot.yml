version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    ignore:
      # @emnapi/* は wasm32-wasi 系パッケージが期待する版に合わせ overrides で固定している
      # （AGENTS.md「npm lockfile と CI」参照）。単独の major bump は無意味なので除外。
      - dependency-name: "@emnapi/*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(ci)"
